<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment — ISGEC</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { max-width: 420px; width: 90%; background: #fff; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.08); padding: 36px; text-align: center; }
        .logo { font-size: 20px; font-weight: bold; color: #1a1a2e; }
        .logo span { color: #f6c215; }
        .msg { margin-top: 18px; font-size: 14px; color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 14px; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">ISGEC <span>|</span> Heavy Engineering</div>
    <div class="msg">{{ message }}</div>
</div>
</body>
</html>
